name: One-time Course Resources Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch course resources
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  print(f'{label}: already applied')
                  return
              if old not in text:
                  raise SystemExit(f'Could not find patch anchor for {label} in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'{label}: applied')

          # Backend course document fields.
          replace(
              'Backend/src/models/Course.js',
              '''    thumbnail: {\n      type: String,\n      default: "",\n    },\n\n    category:''',
              '''    thumbnail: {\n      type: String,\n      default: "",\n    },\n\n    previewSyllabusPdfUrl: {\n      type: String,\n      default: "",\n      trim: true,\n    },\n\n    freeResourcesUrl: {\n      type: String,\n      default: "",\n      trim: true,\n    },\n\n    category:''',
              'course model fields',
          )

          # Admin backend: expose and persist course resource URLs.
          replace(
              'Backend/src/services/admin.course.service.js',
              '''  thumbnail: course.thumbnail,\n  category: course.category,''',
              '''  thumbnail: course.thumbnail,\n  previewSyllabusPdfUrl: course.previewSyllabusPdfUrl || "",\n  freeResourcesUrl: course.freeResourcesUrl || "",\n  category: course.category,''',
              'admin course formatter',
          )
          replace(
              'Backend/src/services/admin.course.service.js',
              '''    thumbnail: payload.thumbnail || "",\n    category,''',
              '''    thumbnail: payload.thumbnail || "",\n    previewSyllabusPdfUrl: String(payload.previewSyllabusPdfUrl || "").trim(),\n    freeResourcesUrl: String(payload.freeResourcesUrl || "").trim(),\n    category,''',
              'admin course create',
          )
          replace(
              'Backend/src/services/admin.course.service.js',
              '''    "thumbnail",\n    "category",''',
              '''    "thumbnail",\n    "previewSyllabusPdfUrl",\n    "freeResourcesUrl",\n    "category",''',
              'admin course update fields',
          )

          # Public course API: send only course-level resource URLs.
          replace(
              'Backend/src/services/course.service.js',
              '''    thumbnail: course.thumbnail,\n    category: course.category,''',
              '''    thumbnail: course.thumbnail,\n    previewSyllabusPdfUrl: course.previewSyllabusPdfUrl || "",\n    freeResourcesUrl: course.freeResourcesUrl || "",\n    category: course.category,''',
              'public course formatter',
          )

          # Admin UI: add fields to the existing course form.
          replace(
              'Admin/src/App.jsx',
              '''  thumbnail: "",\n  level: "beginner",''',
              '''  thumbnail: "",\n  previewSyllabusPdfUrl: "",\n  freeResourcesUrl: "",\n  level: "beginner",''',
              'admin course form defaults',
          )
          replace(
              'Admin/src/App.jsx',
              '''  thumbnail: form.thumbnail.trim(),\n  level: form.level,''',
              '''  thumbnail: form.thumbnail.trim(),\n  previewSyllabusPdfUrl: form.previewSyllabusPdfUrl.trim(),\n  freeResourcesUrl: form.freeResourcesUrl.trim(),\n  level: form.level,''',
              'admin course payload',
          )
          replace(
              'Admin/src/App.jsx',
              '''  thumbnail: course.thumbnail || "",\n  level: course.level || "beginner",''',
              '''  thumbnail: course.thumbnail || "",\n  previewSyllabusPdfUrl: course.previewSyllabusPdfUrl || "",\n  freeResourcesUrl: course.freeResourcesUrl || "",\n  level: course.level || "beginner",''',
              'admin course edit form',
          )
          replace(
              'Admin/src/App.jsx',
              '''<Field label="Thumbnail URL" value={form.thumbnail} onChange={(v) => update("thumbnail", v)} className="md:col-span-2" /><Field label="Language"''',
              '''<Field label="Thumbnail URL" value={form.thumbnail} onChange={(v) => update("thumbnail", v)} className="md:col-span-2" /><Field label="Preview Syllabus PDF URL" value={form.previewSyllabusPdfUrl} onChange={(v) => update("previewSyllabusPdfUrl", v)} helperText="Public PDF URL opened by the Preview Syllabus button." className="md:col-span-2" /><Field label="Free Resources URL" value={form.freeResourcesUrl} onChange={(v) => update("freeResourcesUrl", v)} helperText="Public resources page/file URL opened by the Free Resources button." className="md:col-span-2" /><Field label="Language"''',
              'admin course resource inputs',
          )

          # Course frontend normalization.
          replace(
              'Course/src/services/course.service.js',
              '''    thumbnail:\n      course.thumbnail || "",\n\n    category:''',
              '''    thumbnail:\n      course.thumbnail || "",\n\n    previewSyllabusPdfUrl:\n      course.previewSyllabusPdfUrl || "",\n\n    freeResourcesUrl:\n      course.freeResourcesUrl || "",\n\n    category:''',
              'frontend course normalization',
          )

          # Course details: add the two actions directly below Watch Demo Class.
          replace(
              'Course/src/pages/CourseDetails.jsx',
              '''            <Button\n              fullWidth\n              variant="contained"\n              size="large"\n              startIcon={<PlayCircle />}\n              onClick={() => setDemoOpen(true)}\n              disabled={!previewVideo}\n              sx={{\n                mt: 2,\n                py: 1.4,\n                borderRadius: 2.5,\n                textTransform: "none",\n                fontWeight: 900,\n                fontSize: "1rem",\n                background: "linear-gradient(135deg,#0875ff,#1d8cff)",\n                boxShadow: "0 14px 30px rgba(14,116,255,.28)",\n              }}\n            >\n              Watch Demo Class\n            </Button>\n\n            <Box sx={{ mt: { xs: 4, md: 5 } }}>''',
              '''            <Button\n              fullWidth\n              variant="contained"\n              size="large"\n              startIcon={<PlayCircle />}\n              onClick={() => setDemoOpen(true)}\n              disabled={!previewVideo}\n              sx={{\n                mt: 2,\n                py: 1.4,\n                borderRadius: 2.5,\n                textTransform: "none",\n                fontWeight: 900,\n                fontSize: "1rem",\n                background: "linear-gradient(135deg,#0875ff,#1d8cff)",\n                boxShadow: "0 14px 30px rgba(14,116,255,.28)",\n              }}\n            >\n              Watch Demo Class\n            </Button>\n\n            <Stack\n              direction={{ xs: "column", sm: "row" }}\n              spacing={1.5}\n              sx={{ mt: 1.5 }}\n            >\n              <Button\n                fullWidth\n                variant="outlined"\n                startIcon={<Book />}\n                component="a"\n                href={course.previewSyllabusPdfUrl || undefined}\n                target="_blank"\n                rel="noopener noreferrer"\n                disabled={!course.previewSyllabusPdfUrl}\n                sx={{\n                  py: 1.25,\n                  borderRadius: 2.5,\n                  textTransform: "none",\n                  fontWeight: 900,\n                  color: "#dbeafe",\n                  borderColor: "rgba(148,163,184,.5)",\n                  "&:hover": {\n                    borderColor: "#60a5fa",\n                    bgcolor: "rgba(37,99,235,.08)",\n                  },\n                }}\n              >\n                Preview Syllabus\n              </Button>\n\n              <Button\n                fullWidth\n                variant="outlined"\n                startIcon={<Bolt />}\n                component="a"\n                href={course.freeResourcesUrl || undefined}\n                target="_blank"\n                rel="noopener noreferrer"\n                disabled={!course.freeResourcesUrl}\n                sx={{\n                  py: 1.25,\n                  borderRadius: 2.5,\n                  textTransform: "none",\n                  fontWeight: 900,\n                  color: "#dbeafe",\n                  borderColor: "rgba(148,163,184,.5)",\n                  "&:hover": {\n                    borderColor: "#60a5fa",\n                    bgcolor: "rgba(37,99,235,.08)",\n                  },\n                }}\n              >\n                Free Resources\n              </Button>\n            </Stack>\n\n            <Box sx={{ mt: { xs: 4, md: 5 } }}>''',
              'course resource buttons',
          )

          # Validate no accidental conflict markers were introduced.
          for path in [
              'Backend/src/models/Course.js',
              'Backend/src/services/admin.course.service.js',
              'Backend/src/services/course.service.js',
              'Admin/src/App.jsx',
              'Course/src/services/course.service.js',
              'Course/src/pages/CourseDetails.jsx',
          ]:
              text = Path(path).read_text(encoding='utf-8')
              if any(marker in text for marker in ('<<<<<<<', '=======', '>>>>>>>')):
                  raise SystemExit(f'Conflict marker found in {path}')

          Path('.github/workflows/one-time-course-resources.yml').unlink()

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Backend/src/models/Course.js Backend/src/services/admin.course.service.js Backend/src/services/course.service.js Admin/src/App.jsx Course/src/services/course.service.js Course/src/pages/CourseDetails.jsx .github/workflows/one-time-course-resources.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add course syllabus and free resources"
          git push
