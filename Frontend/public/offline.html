<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <title>ApnaAcademy — Offline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #172033; }
      main { width: min(90%, 520px); text-align: center; padding: 32px 20px; }
      h1 { margin-bottom: 10px; }
      p { color: #64748b; line-height: 1.6; }
      button { border: 0; border-radius: 12px; padding: 12px 18px; background: #2563eb; color: #fff; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>ApnaAcademy is unavailable right now. Reconnect to the internet and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
